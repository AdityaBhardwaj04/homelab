# Minimal Apache httpd 2.4 configuration for the apache-https project.
# Replaces the stock httpd.conf so every loaded module and directive is deliberate.
# Runs as the non-root www-data user (set in the Dockerfile), so it listens on
# unprivileged ports: 8080 for HTTP here, 8443 for HTTPS in extra/httpd-ssl.conf.

ServerRoot "/usr/local/apache2"
Listen 8080

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule reqtimeout_module modules/mod_reqtimeout.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule headers_module modules/mod_headers.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule dir_module modules/mod_dir.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so

ServerName localhost
PidFile logs/httpd.pid

# Reveal as little as possible about the server.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Deny everything by default, then allow only the document root.
<Directory />
    AllowOverride None
    Require all denied
</Directory>

DocumentRoot "/usr/local/apache2/htdocs"
<Directory "/usr/local/apache2/htdocs">
    Options None
    AllowOverride None
    Require all granted
</Directory>

DirectoryIndex index.html
TypesConfig conf/mime.types

# Log to the container's stdout/stderr so `docker logs` shows them.
ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog /proc/self/fd/1 combined

# Basic response headers for a static site.
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "no-referrer"

Include conf/extra/httpd-ssl.conf
